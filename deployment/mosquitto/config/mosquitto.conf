# Mosquitto với plugin Dynamic Security: tài khoản và quyền topic được backend quản lý
# qua $CONTROL/dynamic-security/v1, không dùng password_file/acl_file tĩnh.
listener 1883 0.0.0.0
allow_anonymous false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/

log_dest stdout
