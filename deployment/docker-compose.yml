# Bản dự phòng: mosquitto (Dynamic Security) + postgres + backend + frontend.
# Chạy từ thư mục deployment/:  docker compose up -d
# Tên container và cổng khác bản gốc (mosquitto 1884, postgres 5433, backend 3001, web 8081)
# nên chạy song song được với bản gốc dùng cổng 1883.
name: smart-watering-dp

services:
  mosquitto-init:
    image: eclipse-mosquitto:2
    container_name: sw-dp-mosquitto-init
    env_file: ../.env
    entrypoint: ["/bin/sh", "/init/init-dynsec.sh"]
    volumes:
      - mosq-data:/mosquitto/data
      - ./mosquitto/init-dynsec.sh:/init/init-dynsec.sh:ro
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sw-dp-mosquitto
    ports:
      - "1884:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosq-data:/mosquitto/data
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sw-dp-postgres
    env_file: ../.env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: sw-dp-backend
    env_file: ../.env
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      PORT: "3000"
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    container_name: sw-dp-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mosq-data:
  pgdata:
