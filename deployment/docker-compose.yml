services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smart-watering-mosquitto
    # Chạy bằng uid của người dùng máy host để đọc được passwd (0600) và ghi được data/log.
    # Nếu `id -u` của bạn khác 1000 thì đặt MOSQ_UID và MOSQ_GID trước khi chạy.
    user: "${MOSQ_UID:-1000}:${MOSQ_GID:-1000}"
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

